<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Repaso ATC</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: una columna tipo "mostrador de farmacia": cabecera con un código ATC desglosado, panel de selección y la pregunta como ficha. */
:root{
  --bg:#F2F6F5; --surface:#FFFFFF; --sunken:#E6EEEC; --ink:#13302B; --muted:#52706A; --line:#CFDDD9;
  --accent:#17807A; --accent-ink:#FFFFFF; --accent-soft:#D5EDEA;
  --hot:#D2601A; --hot-soft:#FBE6D8;
  --ok:#22804A; --ok-soft:#DCF1E3; --bad:#B6352A; --bad-soft:#F8DFDB;
  --chipL:42%; --chipS:50%; --chipInk:#FFFFFF;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1716; --surface:#152321; --sunken:#1C2D2A; --ink:#E2EDEA; --muted:#97B0AA; --line:#2A3F3B;
    --accent:#4CC2B5; --accent-ink:#0A1A18; --accent-soft:#1D3A36;
    --hot:#F0904E; --hot-soft:#3A2618;
    --ok:#62C97A; --ok-soft:#173527; --bad:#F07264; --bad-soft:#3C1E1A;
    --chipL:62%; --chipS:48%; --chipInk:#0E1716;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1716; --surface:#152321; --sunken:#1C2D2A; --ink:#E2EDEA; --muted:#97B0AA; --line:#2A3F3B;
  --accent:#4CC2B5; --accent-ink:#0A1A18; --accent-soft:#1D3A36;
  --hot:#F0904E; --hot-soft:#3A2618;
  --ok:#62C97A; --ok-soft:#173527; --bad:#F07264; --bad-soft:#3C1E1A;
  --chipL:62%; --chipS:48%; --chipInk:#0E1716;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
.wrap{max-width:780px;margin:0 auto;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible+span,summary:focus-visible{outline:3px solid var(--hot);outline-offset:2px}

/* Cabecera */
.top{display:flex;flex-direction:column;gap:14px}
.eyebrow{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.top h1{font-size:clamp(2rem,6vw,2.8rem);font-weight:800;letter-spacing:-.02em}
.top h1 em{font-style:normal;color:var(--accent)}
.code{display:flex;gap:4px;font-family:var(--f-mono);overflow-x:auto}
.code .seg{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.code .seg b{display:block;padding:6px 10px;border-radius:6px;background:var(--surface);border:1px solid var(--line);font-size:clamp(1.1rem,4.5vw,1.6rem);font-weight:700;letter-spacing:.04em}
.code .seg:nth-child(1) b{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.code .seg small{font-family:var(--f-body);font-size:.68rem;color:var(--muted);text-align:center;line-height:1.2}

/* Pestañas */
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;padding:10px 14px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--hot)}

/* Selección */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:16px}
.panel h2{font-size:1.25rem}
.step{display:flex;flex-direction:column;gap:10px}
.step>.lbl{font-size:.78rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700}
.block{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--bg);cursor:pointer}
.block input{width:20px;height:20px;accent-color:var(--accent);margin:2px 0 0;flex:none}
.block strong{display:block}
.block span{color:var(--muted);font-size:.9rem}
.block:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.sysgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.sysbtn{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);text-align:left;font-size:.9rem;line-height:1.25}
.sysbtn[aria-pressed="true"]{border-color:var(--ink);background:var(--sunken);font-weight:700}
.sysbtn[aria-pressed="false"] .chip{opacity:.45}
.chip{flex:none;display:inline-grid;place-items:center;width:30px;height:30px;border-radius:6px;font-family:var(--f-mono);font-weight:700;background:hsl(var(--h) var(--chipS) var(--chipL));color:var(--chipInk)}
.chip.sm{width:24px;height:24px;font-size:.8rem;border-radius:5px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ghost{background:none;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:.85rem;color:var(--muted)}
.ghost:hover{color:var(--ink);border-color:var(--ink)}
.seg-ctl{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg-ctl button{background:var(--surface);border:0;padding:8px 16px;font-weight:700;font-variant-numeric:tabular-nums}
.seg-ctl button+button{border-left:1px solid var(--line)}
.seg-ctl button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chk{display:inline-flex;gap:8px;align-items:center;padding:6px 12px;border:1px solid var(--line);border-radius:999px;cursor:pointer;font-size:.92rem}
.chk input{accent-color:var(--accent);width:18px;height:18px;margin:0}
.chk:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.subtle{color:var(--muted);font-size:.9rem}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:12px 22px;font-weight:700;font-size:1.02rem}
.primary:disabled{opacity:.45;cursor:not-allowed}
.secondary{background:var(--surface);border:1px solid var(--ink);border-radius:8px;padding:11px 18px;font-weight:700}
.warn{color:var(--bad);font-weight:700;font-size:.9rem}

/* Pregunta */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.count{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem}
.bar{height:6px;background:var(--sunken);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--hot);transition:width .3s}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:16px}
.tag{display:inline-flex;align-items:center;gap:8px;font-size:.82rem;font-weight:700;color:var(--muted)}
.kicker{font-size:.76rem;letter-spacing:.08em;text-transform:uppercase;color:var(--hot);font-weight:700}
.qtitle{font-family:var(--f-display);font-size:clamp(1.3rem,4.6vw,1.65rem);font-weight:700;line-height:1.2;text-wrap:balance}
.qtitle.long{font-family:var(--f-body);font-size:1.12rem;font-weight:700;line-height:1.4}
.qprompt{color:var(--muted);font-size:1rem}
.qcode{font-family:var(--f-mono);font-size:1.5rem;font-weight:700;letter-spacing:.06em;display:flex;gap:2px;flex-wrap:wrap}
.qcode span{padding:2px 4px;border-radius:4px}
.qcode .hl{background:var(--hot);color:var(--surface)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--bg);line-height:1.35}
.opt .k{flex:none;font-family:var(--f-mono);font-weight:700;color:var(--muted);width:1.2em}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.dim{opacity:.55}
.vf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vf .opt{justify-content:center;font-weight:700;font-size:1.05rem;padding:16px}
.letters{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.letters .opt{justify-content:center;font-family:var(--f-mono);font-size:1.6rem;font-weight:700;padding:14px}
.fb{border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;line-height:1.45}
.fb.ok{background:var(--ok-soft);border:1px solid var(--ok)}
.fb.bad{background:var(--bad-soft);border:1px solid var(--bad)}
.fb .v{font-weight:700}
.fb.ok .v{color:var(--ok)} .fb.bad .v{color:var(--bad)}
.next{align-self:flex-end}

/* Relacionar */
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcol{display:flex;flex-direction:column;gap:8px;min-width:0}
.mcol h4{margin:0;font-size:.75rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.mi{position:relative;text-align:left;padding:10px 10px 10px 38px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:.92rem;line-height:1.3;min-height:48px;overflow-wrap:anywhere}
.mi .n{position:absolute;left:8px;top:10px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:.78rem;font-weight:700;border:1px dashed var(--line);color:var(--muted)}
.mi.paired .n{border:0;background:var(--ink);color:var(--bg)}
.mi.sel{border-color:var(--hot);box-shadow:0 0 0 2px var(--hot)}
.mi.ok{border-color:var(--ok);background:var(--ok-soft)}
.mi.bad{border-color:var(--bad);background:var(--bad-soft)}
.mi .fix{display:block;margin-top:6px;font-size:.82rem;color:var(--bad);font-weight:700}
.mhelp{font-size:.88rem;color:var(--muted)}

/* Resultados */
.score{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.score .big{font-family:var(--f-display);font-size:3.2rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.score .pct{font-family:var(--f-mono);font-size:1.2rem;color:var(--muted)}
.bkt{display:flex;flex-direction:column;gap:6px}
.bkt .r{display:grid;grid-template-columns:minmax(0,1fr) 120px 56px;gap:10px;align-items:center;font-size:.92rem}
.bkt .r .m{height:8px;background:var(--sunken);border-radius:99px;overflow:hidden}
.bkt .r .m i{display:block;height:100%;background:var(--accent)}
.bkt .r .v{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.miss{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.miss li{border-left:3px solid var(--bad);padding:4px 0 4px 12px;font-size:.93rem}
.miss li .a{color:var(--ok);font-weight:700}

/* Tablas de repaso */
details.sys{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
details.sys summary{display:flex;gap:12px;align-items:center;padding:12px 14px;cursor:pointer;font-weight:700;list-style:none}
details.sys summary::-webkit-details-marker{display:none}
details.sys summary::after{content:"+";margin-left:auto;font-family:var(--f-mono);color:var(--muted);font-size:1.2rem}
details.sys[open] summary::after{content:"–"}
.sysdesc{padding:0 14px 10px;color:var(--muted);font-size:.92rem}
.tbl{overflow-x:auto;padding:0 14px 14px}
.tbl table{border-collapse:collapse;width:100%;min-width:520px;font-size:.9rem}
.tbl th{text-align:left;font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td:first-child{font-weight:700;width:30%}
.tbl td:last-child{width:28%}
.note{background:var(--hot-soft);border-radius:8px;padding:14px 16px;font-size:.93rem;display:flex;flex-direction:column;gap:6px}
.note ul{margin:0;padding-left:20px}
.lvtbl{overflow-x:auto}
.lvtbl table{border-collapse:collapse;width:100%;min-width:480px;font-size:.92rem}
.lvtbl td,.lvtbl th{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.lvtbl th{font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.lvtbl td.c{font-family:var(--f-mono);font-weight:700}
footer{color:var(--muted);font-size:.82rem;text-align:center}

@media (max-width:520px){
  .match{grid-template-columns:1fr 1fr;gap:6px}
  .mi{font-size:.84rem;padding:8px 6px 8px 32px}
  .mi .n{left:5px;width:20px;height:20px}
  .bkt .r{grid-template-columns:minmax(0,1fr) 70px 50px}
  .qcard,.panel{padding:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>


<div class="wrap">
  <header class="top">
    <div class="eyebrow">CFGM Farmacia · Dispensación de productos farmacéuticos · UD 3</div>
    <h1>Repaso <em>ATC</em></h1>
    <div class="code" aria-label="Ejemplo de código ATC desglosado: A10BA02">
      <div class="seg"><b>A</b><small>Anatómico</small></div>
      <div class="seg"><b>10</b><small>Terapéutico</small></div>
      <div class="seg"><b>B</b><small>Subgrupo</small></div>
      <div class="seg"><b>A</b><small>Químico</small></div>
      <div class="seg"><b>02</b><small>Principio activo</small></div>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" id="tab-practica" aria-selected="true">Practicar</button>
    <button role="tab" id="tab-tablas" aria-selected="false">Tablas de repaso</button>
  </nav>

  <main id="view"></main>

  <footer>Preguntas generadas a partir de los apuntes de la UD 3. Cada intento elige y baraja preguntas distintas.</footer>
</div>

<script>
/* =====================================================================
   DATOS — se pueden ampliar aquí sin tocar el resto del código.
   Cada sistema: letra (l), nombre (n), nombre corto (c), descripción (d)
   y sus grupos terapéuticos (g): id interno (nunca se muestra), nombre (n),
   para qué sirve (u) y ejemplos de principios activos (ex).
   ===================================================================== */
const SYS = [
 {l:'A',h:28,n:'Tracto alimentario y metabolismo',c:'Alimentario y metabolismo',d:'Medicamentos asociados al aparato digestivo: procesamiento del alimento, absorción de nutrientes y eliminación de residuos',g:[
  {id:'A01',n:'Preparados estomatológicos',u:'Tratar afecciones de boca y dientes: caries, candidiasis oral e infecciones bucofaríngeas',ex:['Clorhexidina','Miconazol']},
  {id:'A02',n:'Antiácidos',u:'Reducir o neutralizar la secreción de jugos gástricos o su efecto',ex:['Omeprazol','Almagato']},
  {id:'A04',n:'Antieméticos',u:'Impedir o controlar el vómito y las náuseas (embarazo, quimioterapia)',ex:[]},
  {id:'A05',n:'Terapia biliar y hepática',u:'Tratar el hígado y la vesícula biliar',ex:[]},
  {id:'A06',n:'Laxantes',u:'Estimular la evacuación intestinal y disminuir la consistencia de las heces',ex:['Glicerol (supositorios)']},
  {id:'A07',n:'Antidiarreicos, antiinflamatorios y antiinfecciosos intestinales',u:'Reducir el peristaltismo y regular la hipersecreción de agua en el intestino',ex:['Loperamida (Fortasec)']},
  {id:'A09',n:'Digestivos',u:'Aliviar alteraciones digestivas como aerofagia, flatulencia o mala digestión de nutrientes',ex:['Lactasa']},
  {id:'A10',n:'Antidiabéticos',u:'Tratar la diabetes (insulinas o hipoglucemiantes orales)',ex:['Metformina','Insulinas']}]},
 {l:'B',h:355,n:'Sangre y órganos hematopoyéticos',c:'Sangre',d:'Prevenir y tratar problemas relacionados con la sangre, por ejemplo obstrucciones de vasos sanguíneos por trombos',g:[
  {id:'B01',n:'Antitrombóticos',u:'Inhibir la coagulación de la sangre y prevenir la formación de trombos',ex:['Acenocumarol (Sintrom)','Heparinas']},
  {id:'B02',n:'Antihemorrágicos',u:'Tratar trastornos de la coagulación de tipo hemorrágico',ex:['Vitamina K']},
  {id:'B03',n:'Preparados antianémicos',u:'Tratar estados anémicos',ex:['Preparados con hierro','Ácido fólico']}]},
 {l:'C',h:330,n:'Sistema cardiovascular',c:'Cardiovascular',d:'Tratar afecciones del corazón o de los vasos sanguíneos',g:[
  {id:'C01',n:'Terapia cardíaca',u:'Tratar arritmias y aumentar la fuerza y velocidad de contracción del corazón',ex:['Digoxina']},
  {id:'C02',n:'Antihipertensivos',u:'Reducir la hipertensión arterial (HTA)',ex:['Doxazosina']},
  {id:'C03',n:'Diuréticos',u:'Estimular la formación y eliminación de orina y reducir el líquido en sangre',ex:['Furosemida']},
  {id:'C05',n:'Vasoprotectores',u:'Proteger los vasos sanguíneos por vía tópica (hemorroides, fisuras anales)',ex:[]},
  {id:'C07',n:'Betabloqueantes',u:'Reducir la frecuencia cardíaca; cardioprotección tras un infarto',ex:['Bisoprolol']},
  {id:'C08',n:'Bloqueantes de canales de calcio',u:'Relajar las arterias y reducir la presión arterial y la angina de pecho',ex:['Amlodipino']},
  {id:'C09',n:'Agentes del sistema renina-angiotensina',u:'Tratar la hipertensión y la insuficiencia cardíaca',ex:['Enalapril']},
  {id:'C10',n:'Hipolipemiantes',u:'Reducir los lípidos en sangre, sobre todo el colesterol',ex:['Atorvastatina','Simvastatina']}]},
 {l:'D',h:38,n:'Dermatológicos',c:'Dermatológico',d:'Tratar enfermedades o lesiones de la piel; de aplicación tópica y muchos de venta libre',g:[
  {id:'D01',n:'Antifúngicos dermatológicos',u:'Tratar infecciones de la piel causadas por hongos (dermatofitos)',ex:['Clotrimazol','Ketoconazol']},
  {id:'D02',n:'Emolientes y protectores',u:'Hidratar la piel y evitar la sequedad (dermatitis, piel seca)',ex:['Urea (Ureadin)']},

  {id:'D04',n:'Antipruriginosos',u:'Aliviar el picor o escozor',ex:['Calamina']},
  {id:'D05',n:'Antipsoriásicos',u:'Tratar la psoriasis',ex:['Breas de carbón']},
  {id:'D06',n:'Antibióticos dermatológicos',u:'Tratar infecciones bacterianas superficiales de la piel (heridas infectadas, quemaduras, impétigo)',ex:['Mupirocina (Bactroban)']},
  {id:'D07',n:'Corticoesteroides dermatológicos',u:'Acción antiinflamatoria y antipruriginosa en la piel: eccemas leves y dermatitis de contacto',ex:['Hidrocortisona','Metilprednisolona']},
  {id:'D08',n:'Antisépticos y desinfectantes',u:'Inhibir o destruir el crecimiento de microorganismos',ex:['Clorhexidina','Povidona yodada']}]},

  {id:'G02',n:'Otros productos ginecológicos',u:'Inhibidores de prolactina, antiinflamatorios vaginales y anticonceptivos de uso tópico',ex:['Anillo vaginal de etonogestrel y etinilestradiol']},
  {id:'G03',n:'Hormonas sexuales y moduladores del sistema genital',u:'Regular el ciclo menstrual, anticoncepción hormonal y tratamiento de la menopausia',ex:['Levonorgestrel/etinilestradiol','Progesterona']},
  {id:'G04',n:'Preparados urológicos',u:'Problemas de vías urinarias: incontinencia, litiasis renal, disfunción eréctil, hiperplasia benigna de próstata',ex:['Tamsulosina','Sildenafilo (Viagra)']}]},
 {l:'H',h:262,n:'Preparados hormonales sistémicos (excluye hormonas sexuales e insulinas)',c:'Hormonales sistémicos',d:'Tratar glándulas del sistema endocrino, excepto hormonas sexuales e insulinas, que van en otros grupos',g:[

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
const pick=a=>a[Math.random()*a.length|0];
const coin=()=>Math.random()<.5;
const key=d=>d.replace(/\s*\(.*?\)\s*/g,'').trim().toLowerCase();
function take(lists,n,keyf,used=new Set()){const out=[];for(const l of lists){for(const x of shuffle(l)){if(out.length>=n)return out;const k=keyf(x);if(used.has(k))continue;used.add(k);out.push(x);}}return out;}

const BY={},G={},ALLG=[],DG={};
for(const s of SYS){BY[s.l]=s;for(const g of s.g){g.sys=s.l;G[g.id]=g;ALLG.push(g);for(const d of g.ex){(DG[key(d)]??=new Set()).add(g.id);}}}
for(const [k,ids] of Object.entries(ALSO)) for(const id of ids) (DG[k]??=new Set()).add(id);
const conflict=(a,b)=>a===b||CONFLICTS.some(c=>c.includes(a)&&c.includes(b));
const sysLabel=l=>`${l} · ${BY[l].n}`;
const chip=(l,sm)=>`<span class="chip${sm?' sm':''}" style="--h:${BY[l].h}">${l}</span>`;
const ALLDRUGS=ALLG.flatMap(g=>g.ex.map(d=>({d,g})));
const NOT_LETTERS=['E','F','I','K','O','Q','T','U','W','X','Y','Z'];

function mc(o){const opts=shuffle([o.correct,...o.wrong]);return Object.assign({type:'mc'},o,{options:opts,answer:opts.indexOf(o.correct)});}
function vf(o){return Object.assign({type:'vf'},o);}

   GENERADORES — NIVEL 2
   ===================================================================== */
function gExplain(g){return `<b>${esc(g.n)}</b> · grupo ${g.sys} (${esc(BY[g.sys].n)}). Sirven para: ${esc(g.u)}.`+(g.ex.length?` Ejemplos: ${esc(g.ex.join(', '))}.`:'');}
function drugNote(d,g){const ids=[...(DG[key(d)]||[])].filter(id=>id!==g.id);if(!ids.length)return '';return ` <br><b>Ojo:</b> ${esc(key(d).replace(/^./,c=>c.toUpperCase()))} también aparece en ${ids.map(id=>`${esc(G[id].n)} (${G[id].sys})`).join(' y en ')}.`;}
function distractGroups(g,dk){const ok=x=>!conflict(g.id,x.id)&&!(dk&&DG[dk]?.has(x.id));return [BY[g.sys].g.filter(ok),ALLG.filter(x=>x.sys!==g.sys&&ok(x))];}
function distractDrugs(g){const ok=({d,g:x})=>x.id!==g.id&&![...(DG[key(d)]||[])].some(id=>conflict(id,g.id));const all=ALLDRUGS.filter(ok);return [all.filter(x=>x.g.sys===g.sys),all.filter(x=>x.g.sys!==g.sys)];}

function poolN2(l,selected){
 const s=BY[l],out=[],tag=`n2:${l}`;
 for(const g of s.g){
  const E=gExplain(g);
  out.push({kind:'mc',subj:g.id,make:()=>mc({kicker:'Grupo terapéutico',title:g.n,prompt:'¿Para qué sirve este grupo?',correct:g.u,wrong:take(distractGroups(g),3,x=>x.u,new Set([g.u])).map(x=>x.u),explain:E})});
  out.push({kind:'mc',subj:g.id,make:()=>mc({kicker:'¿Qué grupo terapéutico…?',title:g.u,long:true,prompt:'¿Qué grupo terapéutico sirve para esto?',correct:g.n,wrong:take(distractGroups(g),3,x=>x.n,new Set([g.n])).map(x=>x.n),explain:E})});
  out.push({kind:'mc',subj:g.id,make:()=>mc({kicker:'Grupo terapéutico',title:g.n,prompt:'¿En qué grupo anatómico (nivel 1) se clasifica?',correct:sysLabel(l),wrong:shuffle(SYS.filter(x=>x.l!==l)).slice(0,3).map(x=>sysLabel(x.l)),explain:E})});
  out.push({kind:'vf',subj:g.id,make:()=>{const t=coin();const u=t?g.u:take(distractGroups(g),1,x=>x.u)[0].u;return vf({kicker:'Verdadero o falso',statement:`El grupo <b>${esc(g.n)}</b> sirve para: ${esc(u.charAt(0).toLowerCase()+u.slice(1))}.`,answer:t,explain:E});}});
  out.push({kind:'vf',subj:g.id,make:()=>{const t=coin();const L=t?l:pick(SYS.filter(x=>x.l!==l)).l;return vf({kicker:'Verdadero o falso',statement:`El grupo terapéutico <b>${esc(g.n)}</b> se clasifica en el grupo anatómico <b>${L}</b> (${esc(BY[L].n)}).`,answer:t,explain:E});}});
  for(const d of g.ex){
   const dk=key(d);const N=drugNote(d,g);
   out.push({kind:'mc',subj:g.id,make:()=>mc({kicker:'Principio activo',title:d,prompt:'¿A qué grupo terapéutico pertenece?',correct:g.n,wrong:take(distractGroups(g,dk),3,x=>x.n,new Set([g.n])).map(x=>x.n),explain:E+N})});
   out.push({kind:'mc',subj:g.id,make:()=>mc({kicker:'Grupo terapéutico',title:g.n,prompt:'¿Cuál de estos principios activos es un ejemplo de este grupo?',correct:d,wrong:take(distractDrugs(g),3,x=>key(x.d),new Set([dk])).map(x=>x.d),explain:E+N})});
   out.push({kind:'mc',subj:g.id,make:()=>{const sysOf=new Set([...DG[dk]].map(id=>G[id].sys));return mc({kicker:'Principio activo',title:d,prompt:'¿En qué grupo anatómico (nivel 1) se clasifica?',correct:sysLabel(l),wrong:shuffle(SYS.filter(x=>!sysOf.has(x.l))).slice(0,3).map(x=>sysLabel(x.l)),explain:E+N});}});
   out.push({kind:'vf',subj:g.id,make:()=>{const t=coin();const w=t?g:take(distractGroups(g,dk),1,x=>x.id)[0];return vf({kicker:'Verdadero o falso',statement:`<b>${esc(d)}</b> es un ejemplo del grupo <b>${esc(w.n)}</b>.`,answer:t,explain:E+N});}});
  }
 }
 // Relacionar: dentro del sistema si hay suficientes grupos; si no, se completa con los sistemas elegidos
 const own=s.g, others=ALLG.filter(x=>x.sys!==l&&selected.includes(x.sys)), rest=ALLG.filter(x=>x.sys!==l);
 for(let i=0;i<3;i++) out.push({kind:'match',subj:'md'+i,make:()=>matchDrugs(own,others.length?others:rest)});
 for(let i=0;i<2;i++) out.push({kind:'match',subj:'mu'+i,make:()=>matchUtil(own,others.length?others:rest)});
 return out;
}
function chooseGroups(primary,secondary,n,needEx){
 const chosen=[];
 for(const list of [shuffle(primary),shuffle(secondary)]) for(const g of list){
  if(chosen.length>=n)break;
  if(needEx&&!g.ex.length)continue;
  if(chosen.some(c=>conflict(c.id,g.id)))continue;
  chosen.push(g);
 }
 return chosen;
}
function matchDrugs(primary,secondary){
 const want=primary.filter(g=>g.ex.length).length>=4?4:Math.max(3,Math.min(4,primary.filter(g=>g.ex.length).length));
 const groups=chooseGroups(primary,secondary,want,true);
 const pairs=[];
 for(const g of groups){const ids=new Set(groups.map(x=>x.id));const opts=shuffle(g.ex).filter(d=>[...DG[key(d)]].every(id=>id===g.id||!ids.has(id)));if(opts.length)pairs.push({a:opts[0],b:g.n,g});}
 if(pairs.length<3)return null;
 return buildMatch('Relaciona cada principio activo con su grupo terapéutico','Principio activo','Grupo terapéutico',pairs);
}
function matchUtil(primary,secondary){
 const groups=chooseGroups(primary,secondary,4,false);
 if(groups.length<3)return null;
 return buildMatch('Relaciona cada grupo terapéutico con su utilidad','Grupo terapéutico','Para qué sirve',groups.map(g=>({a:g.n,b:g.u,g})));
}
function buildMatch(prompt,la,lb,pairs){
 pairs=shuffle(pairs);
 const right=shuffle(pairs.map((p,i)=>i));
 return {type:'match',kicker:'Relacionar',prompt,la,lb,left:pairs.map(p=>p.a),right:right.map(i=>pairs[i].b),sol:pairs.map((p,i)=>right.indexOf(i)),
  explain:pairs.map(p=>`<b>${esc(p.a)}</b> → ${esc(p.b)}${p.g?` (${p.g.sys})`:''}`).join('<br>')};
}

function load(){try{const v=JSON.parse(localStorage.getItem('atc-sel')||'null');if(v&&v.types)return Object.assign({},DEF,v);}catch(e){}return JSON.parse(JSON.stringify(DEF));}

function buckets(){
 const b=[];
 if(st.org)b.push({id:'org',label:'Organización ATC',items:poolOrg()});
 if(st.n1)b.push({id:'n1',label:'Nivel 1 · Grupos anatómicos',items:poolN1()});
 if(st.n2)for(const l of st.sys)b.push({id:'n2:'+l,letter:l,label:`Nivel 2 · ${BY[l].c}`,items:poolN2(l,st.sys)});
 for(const x of b)x.items=x.items.filter(d=>st.types[d.kind]);
 return b.filter(x=>x.items.length);
}
function sample(bs,n){
 const allowed=['mc','vf','match'].filter(k=>st.types[k]);
 const w={mc:.55,vf:.3,match:.15};const tw=allowed.reduce((s,k)=>s+w[k],0);
 const plan=[];allowed.forEach(k=>{const c=Math.round(n*w[k]/tw);for(let i=0;i<c;i++)plan.push(k);});
 while(plan.length<n)plan.push(allowed[0]);plan.length=n;
 const P=shuffle(plan);
 const qs=bs.map(b=>({b,q:shuffle(b.items)}));const order=shuffle(qs);
 const used=new Set(),out=[];let bi=0,guard=0;
 while(out.length<n&&guard++<n*40){
  const live=order.filter(x=>x.q.length);if(!live.length)break;
  const cur=live[bi++%live.length];const kind=P[out.length];
  const fresh=d=>!used.has(cur.b.id+'|'+d.subj);
  let idx=cur.q.findIndex(d=>d.kind===kind&&fresh(d));
  if(idx<0)idx=cur.q.findIndex(d=>d.kind===kind);
  if(idx<0)idx=cur.q.findIndex(fresh);
  if(idx<0)idx=0;
  const d=cur.q.splice(idx,1)[0];
  const q=d.make();if(!q)continue;
  used.add(cur.b.id+'|'+d.subj);
  out.push({d,b:cur.b,q});
 }
 return shuffle(out);
}

function setupMatch(q){
 const pairs=Array(q.left.length).fill(null);let sel=null;
 const L=[...view.querySelectorAll('.mi[data-side="l"]')],R=[...view.querySelectorAll('.mi[data-side="r"]')];

  R.forEach((b,r)=>{const l=pairs.indexOf(r);b.classList.toggle('paired',l>=0);b.querySelector('.n').textContent=l>=0?l+1:'';});
  $('#check').disabled=pairs.some(p=>p==null);
 }
 L.forEach((b,k)=>b.onclick=()=>{if(run.answered)return;if(pairs[k]!=null&&sel!==k){pairs[k]=null;sel=k;}else sel=sel===k?null:k;paint();});

  if(sel==null){if(owner>=0){pairs[owner]=null;paint();}return;}
  if(owner>=0)pairs[owner]=null;pairs[sel]=r;
  sel=pairs.findIndex(p=>p==null);if(sel<0)sel=null;paint();});
 sel=0;paint();
 $('#check').onclick=()=>{
  let good=0;
  L.forEach((b,k)=>{const ok=pairs[k]===q.sol[k];if(ok)good++;b.classList.remove('sel');b.classList.add(ok?'ok':'bad');b.disabled=true;
   if(!ok)b.insertAdjacentHTML('beforeend',`<span class="fix">→ ${esc(q.right[q.sol[k]])}</span>`);});
  R.forEach(b=>b.disabled=true);
  $('#check').hidden=true;
  const all=good===q.left.length;const pts=good/q.left.length;
  record(all,pts,q.explain);
  feedback(all,all?q.explain:`Las parejas correctas son:<br>${q.explain}`,`${good} de ${q.left.length} parejas correctas`);
 };
}
function next(){run.i++;if(run.i<run.items.length){renderQ();window.scrollTo({top:0});}else renderResults();}

document.addEventListener('keydown',e=>{
 if(!run||run.i>=run.items.length||$('#tab-tablas').getAttribute('aria-selected')==='true')return;
 if(e.target.closest&&e.target.closest('input'))return;
 const q=run.items[run.i].q;
 if(!run.answered){
  if(q.type==='mc'){const k='1234abcd'.indexOf(e.key.toLowerCase());if(k>=0){answerMC(k%4);e.preventDefault();}}
  if(q.type==='vf'){if(/^[vt1]$/i.test(e.key))answerVF(true);if(/^[f2]$/i.test(e.key))answerVF(false);}
 }else if(e.key==='Enter'&&document.activeElement?.id!=='next'){next();e.preventDefault();}
});

function renderResults(){
 const R=run.results;const pts=R.reduce((s,r)=>s+r.pts,0);const n=R.length;const pct=Math.round(pts/n*100);
 const by={};for(const r of R){const b=r.it.b;(by[b.id]??={b,p:0,n:0});by[b.id].p+=r.pts;by[b.id].n++;}
 const misses=R.filter(r=>!r.ok);
 const msg=pct>=90?'Dominas este bloque.':pct>=70?'Buen trabajo. Repasa los fallos y vuelve a intentarlo.':pct>=50?'Vas por buen camino. Echa un vistazo a las tablas de repaso.':'Repasa las tablas y prueba otra vez: cada intento trae preguntas nuevas.';
 const fmt=x=>Number.isInteger(x)?x:x.toFixed(1).replace('.',',');
 view.innerHTML=`
 <section class="panel">
  <span class="eyebrow">Resultado</span>
  <div class="score"><span class="big">${fmt(pts)}<span style="font-size:1.6rem;color:var(--muted)"> / ${n}</span></span><span class="pct">${pct} %</span></div>
  <p style="margin:0">${msg}</p>
  <div class="bkt">${Object.values(by).map(x=>`<div class="r"><span class="tag" style="color:var(--ink)">${x.b.letter?chip(x.b.letter,true):''}${esc(x.b.label)}</span><span class="m"><i style="width:${x.p/x.n*100}%"></i></span><span class="v">${fmt(x.p)}/${x.n}</span></div>`).join('')}</div>
  <div class="row">
   <button class="primary" id="again">Nuevo intento</button>
   ${misses.length?`<button class="secondary" id="fails">Repetir solo los fallos (${misses.length})</button>`:''}
   <button class="ghost" id="change">Cambiar selección</button>
  </div>
 </section>
 ${misses.length?`<section class="panel"><h2>Para repasar</h2><ul class="miss">${misses.map(r=>{const q=r.it.q;const t=q.type==='vf'?q.statement:q.type==='match'?esc(q.prompt):esc(q.title);return `<li><div>${t}</div><div class="a">${q.type==='match'?r.correctText:esc(r.correctText)}</div></li>`;}).join('')}</ul></section>`:''}`;
 $('#again').onclick=()=>start(sample(buckets(),st.count));
 if(misses.length)$('#fails').onclick=()=>start(shuffle(misses.map(r=>{const q=r.it.d.make();return q?{d:r.it.d,b:r.it.b,q}:null;}).filter(Boolean)));
 $('#change').onclick=()=>{run=null;renderSetup();};
 window.scrollTo({top:0});
}

function renderTables(){
 const multi=Object.entries(DG).filter(([k,s])=>s.size>1);
 view.innerHTML=`
 <section style="display:flex;flex-direction:column;gap:12px">
  <details class="sys" open><summary>Niveles del código ATC</summary>
   <div class="tbl lvtbl" style="padding:0 14px 14px"><table><thead><tr><th>Nivel</th><th>Nombre</th><th>Se codifica con</th><th>Qué indica</th><th>En A10BA02</th></tr></thead><tbody>
   ${LV.map((l,k)=>`<tr><td class="c">${k+1}</td><td><b>${esc(l.n)}</b></td><td>${esc(l.f)}</td><td>${esc(l.info)}</td><td class="c">${['A','10','B','A','02'][k]} <span style="font-family:var(--f-body);font-weight:400;color:var(--muted)">· ${esc(A10[k].replace(/^Es (un |una )?|^Actúa sobre el |^El principio activo es la /,''))}</span></td></tr>`).join('')}
   </tbody></table></div></details>
  ${SYS.map(s=>`<details class="sys"><summary>${chip(s.l)}<span>${esc(s.n)}</span></summary>
   <div class="sysdesc">${esc(s.d)}.</div>
   <div class="tbl"><table><thead><tr><th>Grupo terapéutico</th><th>Para qué sirve</th><th>Ejemplos</th></tr></thead><tbody>
   ${s.g.map(g=>`<tr><td>${esc(g.n)}</td><td>${esc(g.u)}</td><td>${g.ex.length?esc(g.ex.join(', ')):'<span class="subtle">—</span>'}</td></tr>`).join('')}
   </tbody></table></div></details>`).join('')}
  <div class="note"><b>Ojo: principios activos que aparecen en más de un grupo</b>
   <ul>${multi.map(([k,s])=>`<li><b>${esc(k.replace(/^./,c=>c.toUpperCase()))}</b>: ${[...s].map(id=>`${esc(G[id].n.toLowerCase())} (${G[id].sys})`).join(', ')}</li>`).join('')}</ul></div>
 </section>`;
}

renderSetup();
</script>
